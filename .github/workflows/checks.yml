# Checks every change. On main, also builds and deploys the GitHub Pages site: the web portal at
# the root and the firmware installer at flash/, with the firmware images built here.
name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  host:
    # Strict TypeScript, generated TS/C++ schema and vendor checks, compiler-backed host tests
    # (UBSan/ASan), Python updater tests and the production web build.
    name: Host checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [24, 25]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  format:
    # Prettier for TypeScript, CSS, HTML, JSON and YAML; clang-format for firmware C/C++;
    # ruff for Python.
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned clang-format
        run: |
          python3 -m venv .tools/clang-format
          .tools/clang-format/bin/pip install clang-format==23.1.3
      - name: Install pinned ruff
        run: |
          python3 -m venv .tools/ruff
          .tools/ruff/bin/pip install ruff==0.17.1
      - run: npm run format:check

  firmware-unit:
    # Standalone CMake/CTest suite for the portable firmware components, built with -Werror.
    name: Firmware unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cmake -S firmware -B build/host-protocol -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host-protocol --parallel
      - run: ctest --test-dir build/host-protocol --output-on-failure
      - run: build/host-protocol/codec_bridge selftest

  firmware-build:
    # Builds each board image with the ESP-IDF pinned in firmware/esp-idf.lock.json and checks
    # the generated manifest. Nothing is flashed; this does not qualify hardware behavior.
    name: Firmware build (${{ matrix.board }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: espressif/idf:v5.5.4@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b
    strategy:
      fail-fast: false
      matrix:
        board: [heltec-v3, heltec-wsl-v3, tbeam-v12]
    env:
      BOARD: ${{ matrix.board }}
      REAPER_IDF_FROM_ENV: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Trust the checkout
        # The container runs as root while the workspace belongs to the runner user.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Build
        shell: bash
        run: bash tools/build-firmware.sh "$BOARD"
      - name: Check manifest
        shell: bash
        run: |
          python3 - <<'EOF'
          import json, os
          board = os.environ["BOARD"]
          manifest = json.load(open(f"build/{board}/reaper-manifest.json"))
          assert not manifest["source_dirty"], "build modified or created tracked files"
          rows = "\n".join(f"| `{a['file']}` | {a['offset']} | {a['size']:,} | `{a['sha256'][:16]}…` |" for a in manifest["artifacts"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"### {manifest['board']}: `{manifest['firmware']}`\n\n"
                            f"ESP-IDF {manifest['sdk']['tag']}, target {manifest['target']}\n\n"
                            f"| File | Offset | Bytes | SHA-256 |\n| --- | --- | --- | --- |\n{rows}\n\n")
          EOF
      - name: Collect ESP-IDF license notices
        # Published with the firmware on the Pages site, as tools/package-firmware.py does.
        if: matrix.board == 'heltec-v3'
        shell: bash
        run: |
          cd "$IDF_PATH"
          find . -name .git -prune -o -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' \
            -o -iname 'NOTICE*' -o -iname 'COPYRIGHT*' \) -print |
            while read -r file; do
              mkdir -p "$GITHUB_WORKSPACE/build/notices/esp-idf/$(dirname "$file")"
              cp "$file" "$GITHUB_WORKSPACE/build/notices/esp-idf/$file"
            done
          test -f "$GITHUB_WORKSPACE/build/notices/esp-idf/components/newlib/COPYING.NEWLIB"
      - name: Keep the notices for the site
        if: matrix.board == 'heltec-v3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: esp-idf-notices
          path: build/notices/
          if-no-files-found: error
          retention-days: 7
      - name: Keep the images for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: |
            build/${{ matrix.board }}/reaper-manifest.json
            build/${{ matrix.board }}/bootloader/bootloader.bin
            build/${{ matrix.board }}/partition_table/partition-table.bin
            build/${{ matrix.board }}/ota_data_initial.bin
            build/${{ matrix.board }}/reaper_mesh_usb.bin
          if-no-files-found: error
          retention-days: 7

  scripts:
    name: Shell script lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: shellcheck --severity=warning tools/*.sh

  site:
    # Builds the Pages site from this commit and validates the firmware with the same checks as a
    # USB install (tools/update-firmware.py). Runs on every change so pull requests prove the site
    # still builds; only main uploads it.
    name: Pages site
    needs: [host, format, firmware-unit, firmware-build, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-heltec-v3
          path: build/heltec-v3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-tbeam-v12
          path: build/tbeam-v12
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-heltec-wsl-v3
          path: build/heltec-wsl-v3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: esp-idf-notices
          path: build/notices
      - run: npm run build:web && npm run build:flasher
      - run: node tools/build-site.ts --require-firmware
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    # Publishes the site. Needs Settings → Pages → Source set to "GitHub Actions".
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
