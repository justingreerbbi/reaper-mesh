# Reaper Mesh on the T1000-E. Nothing here logs or prints: USB carries only the host protocol.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_MAIN_STACK_SIZE=24576

# USB: one CDC ACM port for the agent, plus the 1200-baud bootloader request.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Reaper Mesh"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Reaper Mesh T1000-E"
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# Board hardware.
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_GPIO_HOGS=y
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_REBOOT=y

# Storage: settings in NVS, the key record in its own area. The key record is not a whole number
# of 32-bit words.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y

# Frame encryption through PSA Crypto (components/reaper_crypto/crypto_psa.cpp).
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_ALG_CCM=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y

# Free heap and stack headroom for the portal debug view.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y

# Bluetooth (D47): one bonded, passkey-authenticated phone at a time, Secure Connections only.
# The T1000-E has no screen; the portal shows the passkey over USB.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Reaper"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_ID_MAX=2
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=n
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_GATT_CLIENT=n
# LE Secure Connections pairing runs P-256 ECDH and AES-CMAC (PSA Crypto) on the Bluetooth work
# queues. Zephyr's default stacks (1,200 and 1,400 bytes) overflow during pairing, which halted the
# board. These sizes paired a phone on the T1000-E (November 17, 2026).
CONFIG_BT_RX_STACK_SIZE=6144
CONFIG_BT_LONG_WQ_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Any fatal error restarts the board instead of halting it until someone resets it.
CONFIG_RESET_ON_FATAL_ERROR=y
